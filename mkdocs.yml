      - D03 — Virtualizzazione e Container (Docker): D03-virtualizzazione-e-container.md
      - D04 — Il Progetto Stazione (Prologo): D04-progetto-stazione.md
      - D04b — Gateway e Routing LLM: D04b-gateway-e-routing-llm.md
  - Mondo 2 (Il Cervello):
      - D05 — Data Foundations: D05-data-foundations.md
      - D06 — Matematica e Statistica: D06-math-stat.md
